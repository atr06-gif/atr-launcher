name: Build ATR Launcher

on:
  push:
    branches: [main]
    paths-ignore: ["config/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ATR_KEYSTORE_B64 || secrets.ATR_KEYSTONE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ATR_KEYSTORE_B64 secret yet. Compile check only, nothing gets published."
            echo "signed=false" >> $GITHUB_OUTPUT
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atr-release.jks"
            echo "signed=true" >> $GITHUB_OUTPUT
          fi

      - name: Compile check (no signing key yet)
        if: steps.key.outputs.signed != 'true'
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "^e: |error:" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | head -40 | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
          exit $status

      - name: Build release APK
        if: steps.key.outputs.signed == 'true'
        env:
          ATR_KEYSTORE: ${{ runner.temp }}/atr-release.jks
          ATR_KEYSTORE_PASS: ${{ secrets.ATR_KEYSTORE_PASS || secrets.ATR_KEYSTONE_PASS }}
          ATR_KEY_PASS: ${{ secrets.ATR_KEY_PASS }}
        run: |
          VC=$((100 + ${{ github.run_number }}))
          VN="1.0.${{ github.run_number }}"
          echo "VC=$VC" >> $GITHUB_ENV; echo "VN=$VN" >> $GITHUB_ENV
          set +e
          gradle --no-daemon assembleRelease \
            -PversionCode=$VC -PversionName=$VN \
            -PupdateUrl=https://github.com/${{ github.repository }}/releases/latest/download/version.json \
            -PconfigUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/config/config.json 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "^e: |error:" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | head -40 | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
          [ $status -ne 0 ] && exit $status
          set -e
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/atr-launcher.apk
          cat > out/version.json <<JSON
          {"versionCode": $VC, "versionName": "$VN",
           "apk": "https://github.com/${{ github.repository }}/releases/download/v$VN/atr-launcher.apk",
           "notes": "Build $VN"}
          JSON

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: atr-launcher-${{ env.VN }}
          path: out/

      - name: Publish release (the TV checks this for updates)
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: ATR Launcher ${{ env.VN }}
          make_latest: "true"
          files: |
            out/atr-launcher.apk
            out/version.json
